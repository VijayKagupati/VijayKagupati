<svg viewBox="0 0 800 60" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #fdf8f7; }
    .border { stroke: #000; stroke-width: 2; }
    .text { font-family: 'Courier New', monospace; font-size: 16px; font-weight: bold; fill: #000; }
  </style>

  <rect width="100%" height="100%" class="bg"/>
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle fill="#1c1b1b" cx="2" cy="2" r="1" opacity="0.3"></circle>
  </pattern>
  <rect width="100%" height="100%" fill="url(#dots)"/>

  <text x="20" y="30" class="text">[ COMMS : LATEST_TRANSMISSIONS ]</text>
  <line x1="20" y1="40" x2="330" y2="40" class="border" />
</svg>
